<mat-card class="example-card mb-4" *ngIf="postObj; else noPosts">


    <img mat-card-image [src]="postObj.imageUrl" alt="post image" />


    <mat-card-content>
        <h2 class="post-title">
            {{ postObj.title }}
        </h2>

        <p class="post-content">
            {{ postObj.content }}
        </p>
    </mat-card-content>


    <mat-card-actions class="d-flex justify-content-between">
        <button mat-raised-button color="accent" (click)="onEditPost()">
            <mat-icon>edit</mat-icon>
        </button>

        <button mat-raised-button color="warn" (click)="onRemove(postObj.id)">
            <mat-icon>delete</mat-icon>
        </button>
    </mat-card-actions>

</mat-card>

<ng-template #noPosts>
    <p class="alert alert-warning">No posts available!!!!</p>
</ng-template>
